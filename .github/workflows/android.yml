name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci
        working-directory: idea2agent-app

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        working-directory: idea2agent-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Bundle JS
        run: mkdir -p android/app/src/main/assets && npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        working-directory: idea2agent-app

      - name: Build APK (Release)
        run: cd android && ./gradlew assembleRelease --stacktrace
        working-directory: idea2agent-app

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: idea2agent-app/android/app/build/outputs/apk/release/app-release.apk
