name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          if [ ! -d "$HOME/android-sdk" ]; then
            mkdir -p $HOME/android-sdk
            cd $HOME/android-sdk
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
            yes | ./cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            ./cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" > /dev/null
          fi
          ls -la $HOME/android-sdk/

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        run: |
          cd android
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          chmod +x ./gradlew
          ./gradlew --version 2>&1 || echo "Gradle version failed"
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -200
        continue-on-error: true

      - name: Check for APK
        run: |
          echo "=== Checking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK dir not found"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "outputs dir not found"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
